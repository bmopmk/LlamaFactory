### model
model_name_or_path: /home/genghaoyu/llm/vllm/models/Qwen3-0.6B
trust_remote_code: true

### method
stage: pt
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all

### dataset
dataset: wikipedia_zh_local
cutoff_len: 2048
max_samples: 800
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/qwen3-0.6b/lora/pretrain
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: tensorboard  # choices: [none, wandb, tensorboard, swanlab, mlflow]
logging_dir: saves/qwen3-0.6b/lora/pretrain/runs

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### 40G memory savers
gradient_checkpointing: true
enable_liger_kernel: true
